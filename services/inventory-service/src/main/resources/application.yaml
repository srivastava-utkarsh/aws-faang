server:
  port: 8080

spring:
  application:
    name: inventory-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orderflow}
    username: ${DB_USERNAME:orderflow}
    password: ${DB_PASSWORD:orderflow}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # Entities carry no explicit schema, so Hibernate needs to be told
        # which one they live in — otherwise it resolves them against the
        # connection's default (public) and ddl-auto=validate fails at boot.
        default_schema: inventory

  flyway:
    enabled: true
    locations: classpath:db/migration
    # This service owns the `inventory` schema; order-service owns `public`.
    # Each therefore gets its OWN flyway_schema_history table, which is what
    # lets two independently-deployed services share one Aurora cluster
    # without their migration histories colliding.
    schemas: inventory
    default-schema: inventory
    create-schemas: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
